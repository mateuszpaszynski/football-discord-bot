services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: football_discord_bot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_discord_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  bot:
    build: .
    image: football-bot
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/football_discord_bot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  db-data: