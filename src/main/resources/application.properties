spring.main.web-application-type=none
bot.token=${DISCORD_TOKEN}
football.api=${FOOTBALL_API}
spring.datasource.url=jdbc:postgresql://localhost:5432/football_discord_bot
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.file.name=/home/mateuszpaszynski/football-discord-bot/logs/football-discord-bot.log

# How to pack logs
logging.logback.rollingpolicy.file-name-pattern=/home/mateuszpaszynski/football-discord-bot/logs/%d{yyyy-MM}/football-discord-bot-%d{yyyy-MM-dd}.%i.log.gz

# max size of single file
logging.logback.rollingpolicy.max-file-size=10MB

# after how many days delete history
logging.logback.rollingpolicy.max-history=60

# max folder size
logging.logback.rollingpolicy.total-size-cap=10GB